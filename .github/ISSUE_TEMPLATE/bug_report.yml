name: Report a reader problem
description: Report a missing brief, broken link, incorrect date, accessibility issue, or other reader problem.
title: "[Reader] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the Petrie Daily Brief Reader.
        This report is public. Do not include credentials, API keys, private emails, personal contact details, or confidential information. Redact screenshots. Do not disclose security-sensitive findings here.
  - type: input
    id: page
    attributes:
      label: Affected public page
      description: Paste the page URL without private tokens or sensitive query parameters.
      placeholder: https://petrie.graice.tech/
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Problem category
      options:
        - Missing or outdated edition
        - Broken source or navigation link
        - Incorrect date or attribution
        - Accessibility or readability
        - Reader controls or display
        - Other
    validations:
      required: true
  - type: input
    id: edition
    attributes:
      label: Edition date or story title
      description: Identify the brief or story involved, if applicable.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the shortest sequence that shows the problem.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome on Android, Safari on iPhone, Firefox on Windows
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report check
      options:
        - label: I have removed credentials, private content, and sensitive personal information from this report and its attachments.
          required: true
